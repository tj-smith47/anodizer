name: Setup Docs
description: >-
  Provision the docs jobs' shared toolchain: stable Rust, the Swatinem build
  cache, go-task, and Zola. Collapses the toolchain/cache/task steps the docs.yml
  freshness-check and site-build jobs otherwise repeat. Checkout is NOT included
  — a local composite requires the repo already checked out, so each job keeps
  its own checkout step (matching the setup-rust composite's contract).

inputs:
  cache-targets:
    description: >-
      Forwarded to Swatinem/rust-cache. Set "false" on the site-build job, which
      only runs codegen tasks and never reuses the target/ build outputs.
    default: "true"
  github-token:
    description: Token forwarded to go-task/setup-task as repo-token to avoid API rate limits.
    default: ""
  zola-version:
    description: >-
      Zola release to install. Empty (the default) reads the pinned version from
      the repository's `.zola-version`, which is the same file `task docs:site`
      checks the local binary against — so a workflow and a laptop cannot build
      the docsite with different Zola versions.
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable branch
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-targets: ${{ inputs.cache-targets }}

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        # Pin an exact go-task release. Without `version`, setup-task defaults
        # to `3.x` and resolves "latest 3.x" via the GitHub API at run time —
        # which intermittently fails with "unable to get latest version" and
        # broke Deploy Docs. An explicit version makes the install deterministic
        # and API-independent.
        version: 3.51.1
        repo-token: ${{ inputs.github-token }}

    - name: Resolve the pinned Zola version
      id: zola
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.zola-version }}"
        if [ -z "$version" ]; then
          version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.zola-version")"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Zola
      uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
      with:
        tool: zola@${{ steps.zola.outputs.version }}
