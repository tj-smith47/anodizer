name: Setup Rust
description: >-
  Provision a Rust CI job: toolchain (+ components/targets), optional sccache,
  Swatinem build cache, go-task, taiki-e cargo tools, and the Linux flat-installer
  packaging toolchain. Collapses the toolchain/cache/task/tool steps every ci.yml
  Rust job otherwise repeats. Checkout is NOT included — a local composite requires
  the repo already checked out, so each job keeps its own checkout step.

inputs:
  toolchain:
    description: Rust toolchain channel passed to dtolnay/rust-toolchain.
    default: stable
  components:
    description: Space/comma-separated rustup components (e.g. "clippy", "llvm-tools-preview").
    default: ""
  targets:
    description: Space/comma-separated rustup targets to add.
    default: ""
  cache:
    description: "true to enable the Swatinem/rust-cache build cache."
    default: "true"
  cache-key:
    description: Extra key segment for rust-cache so distinct jobs don't share a cache slot.
    default: ""
  sccache:
    description: >-
      "true to start mozilla-actions/sccache-action. Leave false for coverage:
      sccache's compile cache masks the source llvm-cov must instrument. Callers
      enabling this must also set the job-level RUSTC_WRAPPER=sccache env."
    default: "false"
  task:
    description: "true to install go-task (for jobs that run `task` targets)."
    default: "false"
  github-token:
    description: Token forwarded to go-task/setup-task as repo-token to avoid API rate limits.
    default: ""
  tools:
    description: Comma-separated cargo tools for taiki-e/install-action (e.g. "cargo-nextest,cargo-llvm-cov").
    default: ""
  linux-packaging-tools:
    description: >-
      "true to install the Linux installer-assembly toolchain available on
      the GitHub-hosted runner: cpio/genisoimage/nsis/msitools/makeself via apt.
      These cover the dmg/nsis/msi/makeself assembly stages, which runtime-probe
      their tool and skip-with-pass when absent. The flat-pkg (.pkg) stage additionally
      needs bomutils(mkbom)+xar, neither of which is packaged for Ubuntu 24.04;
      its 2 end-to-end tests stay hermetic skip-with-pass here and are exercised
      locally / on the self-hosted release runner (whose base image carries them).
      The pre-spawn .pkg logic is covered by injected-probe unit tests regardless.
      nfpm is provisioned separately via the `nfpm` input, not here."
    default: "false"
  nfpm:
    description: >-
      "true to install nfpm (deb/rpm/apk) from its release tarball. Set on any
      job whose tests drive the nfpm determinism stage: the gate hard-fails
      rather than skipping when the tool is absent, so it must be present.
      Linux-only."
    default: "false"
  coverage-tools:
    description: >-
      "true to install the runtime-probed toolchain that coverage measurement
      would otherwise silently skip. Tests probe for these and skip-with-pass
      when absent, so a job without them measures LESS code than a developer
      box and its percentage is not comparable to one: snapcraft, cosign, rpm/
      rpmbuild, syft, upx, flatpak-builder and osslsigncode together gate ~780
      probe sites. docker, gpg and dpkg are already on the hosted runner.
      pkgbuild/hdiutil (macOS) and signtool (Windows) cannot be provisioned on a
      Linux runner and remain skip-with-pass here; they are exercised on the
      determinism shards. Linux-only."
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable branch
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Set up sccache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Cache cargo build artifacts
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ inputs.cache-key }}

    - name: Install Task
      if: ${{ inputs.task == 'true' }}
      uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      with:
        repo-token: ${{ inputs.github-token }}

    - name: Install cargo tools
      if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
      with:
        tool: ${{ inputs.tools }}

    - name: Install Linux packaging tools
      if: ${{ inputs.linux-packaging-tools == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cpio genisoimage nsis msitools makeself

    # nfpm has no apt package, so it installs from its release tarball, verified
    # against the release's checksums.txt (immutable tag → no hardcoded sha to
    # drift). Linux-only: the tarball is a Linux build and the test that needs it
    # is cfg(target_os = "linux").
    - name: Install nfpm
      if: ${{ inputs.nfpm == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        version=2.46.3
        case "$RUNNER_ARCH" in
          X64)   arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported arch for nfpm: $RUNNER_ARCH"; exit 1 ;;
        esac
        base="https://github.com/goreleaser/nfpm/releases/download/v${version}"
        tarball="nfpm_${version}_Linux_${arch}.tar.gz"
        dir="${RUNNER_TEMP:-/tmp}/nfpm"
        mkdir -p "$dir"
        curl -sSfL "${base}/${tarball}" -o "${dir}/${tarball}"
        curl -sSfL "${base}/checksums.txt" -o "${dir}/checksums.txt"
        expected=$(grep " ${tarball}\$" "${dir}/checksums.txt" | awk '{print $1}')
        echo "${expected}  ${dir}/${tarball}" | sha256sum -c -
        tar -xzf "${dir}/${tarball}" -C "$dir" nfpm
        chmod +x "${dir}/nfpm"
        printf '%s\n' "$dir" >> "$GITHUB_PATH"
        "${dir}/nfpm" --version

    # Tools the suite runtime-probes and skips on when absent. Without them a
    # coverage run reports a percentage measured over a strictly smaller body of
    # code than a developer box measures, so a floor calibrated on one lies about
    # the other. Checksums are fetched from each project's own published manifest
    # rather than hardcoded, so there is no digest to drift (same rationale as
    # nfpm above).
    - name: Install coverage-probed tools (apt + snap)
      if: ${{ inputs.coverage-tools == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          rpm upx-ucl flatpak-builder osslsigncode
        # upx ships as `upx-ucl` on Debian/Ubuntu; the probes look for `upx`.
        if ! command -v upx >/dev/null && command -v upx-ucl >/dev/null; then
          sudo ln -sf "$(command -v upx-ucl)" /usr/local/bin/upx
        fi
        sudo snap install snapcraft --classic
        for t in rpm rpmbuild upx flatpak-builder osslsigncode snapcraft; do
          command -v "$t" >/dev/null || { echo "::error::$t missing after install"; exit 1; }
        done

    - name: Install cosign and syft
      if: ${{ inputs.coverage-tools == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP:-/tmp}/covtools"
        mkdir -p "$dir"
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported arch: $RUNNER_ARCH"; exit 1 ;;
        esac

        cv=2.4.3
        cbase="https://github.com/sigstore/cosign/releases/download/v${cv}"
        curl -sSfL "${cbase}/cosign-linux-${arch}" -o "${dir}/cosign"
        curl -sSfL "${cbase}/cosign_checksums.txt" -o "${dir}/cosign_checksums.txt"
        expected=$(grep " cosign-linux-${arch}\$" "${dir}/cosign_checksums.txt" | awk '{print $1}')
        echo "${expected}  ${dir}/cosign" | sha256sum -c -
        chmod +x "${dir}/cosign"

        sv=1.18.1
        sbase="https://github.com/anchore/syft/releases/download/v${sv}"
        star="syft_${sv}_linux_${arch}.tar.gz"
        curl -sSfL "${sbase}/${star}" -o "${dir}/${star}"
        curl -sSfL "${sbase}/syft_${sv}_checksums.txt" -o "${dir}/syft_checksums.txt"
        expected=$(grep " ${star}\$" "${dir}/syft_checksums.txt" | awk '{print $1}')
        echo "${expected}  ${dir}/${star}" | sha256sum -c -
        tar -xzf "${dir}/${star}" -C "$dir" syft
        chmod +x "${dir}/syft"

        printf '%s\n' "$dir" >> "$GITHUB_PATH"
        "${dir}/cosign" version
        "${dir}/syft" --version

    # zig publishes its own shasum in index.json, so the digest is resolved at
    # run time from upstream rather than pinned here.
    - name: Install zig
      if: ${{ inputs.coverage-tools == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        ver=0.13.0
        dir="${RUNNER_TEMP:-/tmp}/zig"
        mkdir -p "$dir"
        case "$RUNNER_ARCH" in
          X64)   zarch=x86_64 ;;
          ARM64) zarch=aarch64 ;;
          *) echo "::error::unsupported arch for zig: $RUNNER_ARCH"; exit 1 ;;
        esac
        idx="${dir}/index.json"
        curl -sSfL "https://ziglang.org/download/index.json" -o "$idx"
        url=$(jq -r --arg v "$ver" --arg a "${zarch}-linux" '.[$v][$a].tarball' "$idx")
        sha=$(jq -r --arg v "$ver" --arg a "${zarch}-linux" '.[$v][$a].shasum'  "$idx")
        [ "$url" != "null" ] || { echo "::error::zig $ver/${zarch}-linux not in index.json"; exit 1; }
        curl -sSfL "$url" -o "${dir}/zig.tar.xz"
        echo "${sha}  ${dir}/zig.tar.xz" | sha256sum -c -
        tar -xJf "${dir}/zig.tar.xz" -C "$dir" --strip-components=1
        printf '%s\n' "$dir" >> "$GITHUB_PATH"
        "${dir}/zig" version
