name: "Evidence: Ota disposable determinism (non-blocking)"

on:
  push:
    branches: [bobai/ota-anodizer-v1.6.28]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-ci-drift:
    name: Contract-to-CI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare bounded contract truth with repository CI
        id: drift
        continue-on-error: true
        uses: ota-run/action@8001070c0c9e54ca2b729282df40d1a9f40c8a79 # v1.0.16
        with:
          command: doctor
          source: contract
          fail-on-error: false
          fail-on-ci-drift: true
          comment-pr: false
      - name: Preserve the drift-check outcome
        if: always()
        shell: bash
        run: test "${{ steps.drift.outcome }}" = success

  disposable-determinism:
    name: Ota disposable preflight and drift boundaries (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.98"
      - name: Set up Ota from the contract
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Preview disposable task graph
        shell: bash
        run: ota run pressure:verify --native --dry-run --json . > pressure-preview.json
      - name: Exercise preflight, two builds, and controlled drift
        shell: bash
        run: ota run pressure:verify --native --stream .
      - name: Retain separate outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anodizer-ota-disposable-determinism
          path: |
            pressure-preview.json
            .ota/pressure/evidence/
          include-hidden-files: true
          if-no-files-found: error
