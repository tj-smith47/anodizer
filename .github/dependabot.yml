version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group routine version bumps into one weekly PR; Dependabot security
    # updates bypass grouping and arrive as individual PRs regardless.
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    # `directory: "/"` reaches .github/workflows plus a ROOT-level action.yml —
    # it never descends into .github/actions/<name>/action.yml, so every pin in
    # a composite action goes untracked and silently rots (setup-rust sat on
    # install-action v2.83.4 while the workflows had moved to v2.85.2). Only the
    # plural `directories` key accepts globs, hence the pair.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Self-managed: the floating @v1 is moved by anodizer-action's own
      # release (semantic-release + update-major-tag). Don't let Dependabot
      # track it; a v2 cutover is a deliberate manual bump.
      - dependency-name: "tj-smith47/anodizer-action"
      # Branch pin (stable = master head); Dependabot would "bump" it to the older
      # v1 tag SHA. Manual: gh api repos/dtolnay/rust-toolchain/branches/stable --jq .commit.sha
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
