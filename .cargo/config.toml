[alias]
xtask = "run --package xtask --"

# Every process cargo launches (test binaries under `cargo test`, `nextest`
# and `llvm-cov`, and `cargo run`) reads this. A git the code under test
# spawns — a publisher cloning its index repository and committing there —
# inherits the test process's environment, and nothing else can reach it:
# the fixture helpers (`crates/core/src/test_helpers/spawn.rs`) isolate only
# the commands they spawn themselves. On a host whose global config signs,
# those commits ran the host's gpg, 89 times per stage-publish run.
[env]
# `force` because the CI workflows already export GIT_CONFIG_COUNT=1 with
# init.defaultBranch (for actions/checkout's own git); without it cargo keeps
# the caller's COUNT and the entries below are never read. The caller's one
# key is restated here so nothing is lost.
GIT_CONFIG_COUNT = { value = "4", force = true }
GIT_CONFIG_KEY_0 = { value = "commit.gpgsign", force = true }
GIT_CONFIG_VALUE_0 = { value = "false", force = true }
GIT_CONFIG_KEY_1 = { value = "tag.gpgsign", force = true }
GIT_CONFIG_VALUE_1 = { value = "false", force = true }
GIT_CONFIG_KEY_2 = { value = "core.hooksPath", force = true }
GIT_CONFIG_VALUE_2 = { value = ".git/hooks", force = true }
GIT_CONFIG_KEY_3 = { value = "init.defaultBranch", force = true }
GIT_CONFIG_VALUE_3 = { value = "master", force = true }
# An empty value is read as unset by the job-summary sink, so a test whose
# fixture publishes something cannot append to the CI job's own summary
# page. `force` because GitHub Actions sets the variable on every step.
GITHUB_STEP_SUMMARY = { value = "", force = true }
# Git stops its repository search at the workspace root. A test binary runs
# in its crate's directory, so code under test that falls back to `.` as its
# repository finds no repository at all, the same answer a CI checkout
# fetched without tags gives. Without this, such a test reads the tags of the
# checkout it runs in: it passes on a clone that carries tags and fails in
# CI. Git still finds the repository from the workspace root itself.
GIT_CEILING_DIRECTORIES = { value = ".", relative = true, force = true }

# Windows MSVC determinism. MSVC-only flags (`link-arg=/...`) must be
# scoped per-target — `[build] rustflags` would forward them to lld /
# ld on Linux/macOS, which reject MSVC syntax. The determinism harness
# mirrors these flags via `CARGO_TARGET_<triple>_RUSTFLAGS` because the
# harness sets `RUSTFLAGS` for `--remap-path-prefix`, which (per cargo
# precedence) suppresses these per-target entries — see
# `build_subprocess_env` in `crates/cli/src/determinism_harness.rs`.
#
# Single source of truth: this list MUST stay byte-identical to
# `anodizer_core::determinism::MSVC_DETERMINISM_RUSTFLAGS` (a cargo config
# file cannot import a Rust const). The const's unit test
# `msvc_rustflags_const_matches_cargo_config` reads this file via
# `include_str!` and fails the build if the two drift.
#
# Flags:
#   - `codegen-units=1` — single codegen unit so cross-CU function
#     ordering doesn't shuffle the resulting symbol/section layout
#     (drives Data Directory RVA stability past PE offset 0x108).
#   - `/Brepro` — substitutes PE `TimeDateStamp` with a content hash.
#     <https://learn.microsoft.com/en-us/cpp/build/reference/brepro>
#   - `/OPT:NOICF` — disables Identical COMDAT Folding, whose fold
#     decisions depend on input-file presentation order.
#   - `/INCREMENTAL:NO` — cargo's stock release default already disables
#     incremental linking, but it's set explicitly because `/Brepro` is
#     incompatible with incremental linking and a future profile edit (e.g.
#     a custom `[profile.release]` with `incremental = true`) shouldn't
#     silently re-enable it.
#   - `/DEBUG:NONE` — do not emit a PDB or CodeView debug record.
#     Eliminates the debug directory entry whose GUID would otherwise
#     have to be carefully content-hashed for reproducibility.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "codegen-units=1",
    "-C", "link-arg=/Brepro",
    "-C", "link-arg=/OPT:NOICF",
    "-C", "link-arg=/INCREMENTAL:NO",
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "strip=symbols",
]

[target.aarch64-pc-windows-msvc]
rustflags = [
    "-C", "codegen-units=1",
    "-C", "link-arg=/Brepro",
    "-C", "link-arg=/OPT:NOICF",
    "-C", "link-arg=/INCREMENTAL:NO",
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "strip=symbols",
]
